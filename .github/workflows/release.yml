name: release

# Triggered by pushing a `vMAJOR.MINOR.PATCH` tag.  The job aligns the
# pom.xml version to the tag, builds (no tests — they require LAN access to
# a real bbox), publishes to GitHub Packages as a Maven artifact, and
# creates a GitHub Release with the JARs attached for direct download.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write    # create the GitHub Release
  packages: write    # publish to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: zulu
          # `setup-java` writes a settings.xml that authenticates against the
          # `github` repo id using GITHUB_TOKEN.  This is what the pom's
          # <distributionManagement> resolves against on `mvn deploy`.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Derive version from tag
        id: version
        run: |
          # GITHUB_REF is `refs/tags/v0.1.0` for a tag push.
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          echo "tag=$tag"        >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Align pom.xml version to tag
        run: |
          mvn --batch-mode --no-transfer-progress \
            versions:set \
            -DnewVersion=${{ steps.version.outputs.version }} \
            -DgenerateBackupPoms=false

      - name: Deploy to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn --batch-mode --no-transfer-progress \
            -DskipTests=true \
            deploy

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            target/java-bbox-api-client-${{ steps.version.outputs.version }}.jar
            target/java-bbox-api-client-${{ steps.version.outputs.version }}-sources.jar
            target/java-bbox-api-client-${{ steps.version.outputs.version }}-javadoc.jar
