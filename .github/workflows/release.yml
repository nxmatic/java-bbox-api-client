name: release

# Triggered by pushing a `vMAJOR.MINOR.PATCH` tag.  The tagged commit must
# live on `release/v0` (or any future `release/v*` line) — that branch
# carries the pom version pinned to the literal release.  The workflow
# trusts the tagged tree and does not rewrite pom.xml on the fly.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write    # create the GitHub Release
  packages: write    # publish to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the full history so the ancestor guard below can resolve
          # the `release/v*` branch refs (default checkout depth is 1).
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        run: |
          # GITHUB_REF is `refs/tags/v0.1.4` for a tag push.
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          echo "tag=$tag"        >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag is on a release/v* branch
        # Releases come from `release/v0` (and future `release/v1`, …) only.
        # Anything tagged off `main` is rejected fast — main carries the
        # `-SNAPSHOT` pom and would publish wrong coords.
        run: |
          set -e
          tag_sha="$(git rev-list -n1 "${{ steps.version.outputs.tag }}")"
          for branch in $(git branch -r --list 'origin/release/v*' --format='%(refname:short)'); do
            if git merge-base --is-ancestor "$tag_sha" "$branch"; then
              echo "tag ${{ steps.version.outputs.tag }} is on $branch — proceeding"
              exit 0
            fi
          done
          echo "tag ${{ steps.version.outputs.tag }} is not an ancestor of any release/v* branch; refusing to publish." >&2
          exit 1

      - name: Verify pom.xml version matches tag
        # Trust-the-tree contract: the pom on the tagged commit must declare
        # the literal release version (no SNAPSHOT, no rewrite).  We assert
        # rather than fix — silent rewrites lead to mismatched coords across
        # GH Packages vs. JitPack vs. local clones, which is what the new
        # release-branch flow is meant to eliminate.
        run: |
          pom_version=$(grep -m1 -E '<version>[^<]+</version>' pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')
          expected="${{ steps.version.outputs.version }}"
          if [ "$pom_version" != "$expected" ]; then
            echo "pom.xml version is '$pom_version' but tag implies '$expected'." >&2
            echo "Bump pom.xml on release/v0 before tagging." >&2
            exit 1
          fi
          echo "pom version matches tag: $pom_version"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: zulu
          # `setup-java` writes a settings.xml that authenticates against the
          # `github` repo id using GITHUB_TOKEN.  This is what the pom's
          # <distributionManagement> resolves against on `mvn deploy`.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Deploy to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn --batch-mode --no-transfer-progress \
            -DskipTests=true \
            deploy

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            target/java-bbox-api-client-${{ steps.version.outputs.version }}.jar
            target/java-bbox-api-client-${{ steps.version.outputs.version }}-sources.jar
            target/java-bbox-api-client-${{ steps.version.outputs.version }}-javadoc.jar
