# JitPack build configuration.
#
# JitPack auto-builds tagged releases on demand and serves them at
# `com.github.nxmatic:java-bbox-api-client:<tag>`.  Two constraints force
# the explicit `install:` block instead of letting JitPack invoke its
# bundled `mvn` directly:
#
#   1. JitPack runners default to JDK 8/11; this codebase needs JDK 21+
#      for records and pattern switches.  We pin `openjdk25` below.
#   2. JitPack ships an older Maven (around 3.5) that's incompatible with
#      `maven-compiler-plugin >= 3.12` (which requires Maven 3.6.3+).
#      We download a modern Maven inline.
#
# The pom version is the source of truth — releases come from the
# `release/v0` branch, which carries the literal release version
# (no SNAPSHOT, no `versions:set` dance).  The workflow on GitHub
# Actions trusts the same contract.
#
# Tests are skipped on JitPack: the live-router CRUD test in src/test
# needs LAN access to a real bbox.  The full suite still runs in
# `release.yml` on GitHub Actions before each tag is published.
jdk:
  - openjdk25

install:
  - |
    set -eu
    curl --silent --location --fail \
      "https://archive.apache.org/dist/maven/maven-3/3.9.12/binaries/apache-maven-3.9.12-bin.tar.gz" \
      | tar -xz
    ./apache-maven-3.9.12/bin/mvn -DskipTests=true -B install
